<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand-in projects · Grade 6 Tech</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;650;700&family=Newsreader:opsz,wght@6..72,500;6..72,560;6..72,650&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <p class="kicker">Classroom</p>
    <h1>Four hand-in projects</h1>
    <p class="lead">These four designs are submitted for assessment. Follow the matching lesson’s click-by-click steps, then check the must-include list before you hand in.</p>
    <div id="project-list"></div>
  </div>
  <script src="lessons-a1.js"></script>
  <script src="lessons-a2.js"></script>
  <script src="lessons-b.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    const LESSON_FOR = { 1: 1, 2: 6, 3: 8, 4: 11 };
    document.getElementById("project-list").innerHTML = PROJECTS.map((p) => `
      <div class="note">
        <div class="soft-kicker">Project ${p.n} · ${esc(p.due)}</div>
        <h3>${esc(p.title)}</h3>
        <p>${esc(p.blurb)}</p>
        <p><a href="lesson.html?n=${LESSON_FOR[p.n]}">Open the matching lesson →</a></p>
        <p><strong>Must include</strong></p>
        <ul>${p.must.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>
        <div class="teacher-only">
          <p><strong>Rubric</strong></p>
          <ul>${p.rubric.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>
        </div>
        <p class="student-only hint">Your teacher will score this with a 4-point rubric. Hit every must-include item.</p>
      </div>
    `).join("");
  </script>
</body>
</html>
