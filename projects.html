<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand-in projects · Grade 6 Tech</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;650;700&family=Newsreader:opsz,wght@6..72,500;6..72,560;6..72,650&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <p class="kicker">Classroom</p>
    <h1>Four hand-in projects</h1>
    <p class="lead">These four designs are submitted for assessment. Each one has a must-include list and a 4-point rubric.</p>
    <div id="project-list"></div>
  </div>
  <script src="lessons-a1.js"></script>
  <script src="lessons-a2.js"></script>
  <script src="lessons-b.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById("project-list").innerHTML = PROJECTS.map((p) => `
      <div class="note">
        <div class="soft-kicker">Project ${p.n} · ${p.due}</div>
        <h3>${p.title}</h3>
        <p>${p.blurb}</p>
        <p><strong>Must include</strong></p>
        <ul>${p.must.map((m) => `<li>${m}</li>`).join("")}</ul>
        <div class="teacher-only">
          <p><strong>Rubric</strong></p>
          <ul>${p.rubric.map((r) => `<li>${r}</li>`).join("")}</ul>
        </div>
      </div>
    `).join("");
  </script>
</body>
</html>
